<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff1a1a"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>
  </defs>
  <!-- Octagon Shape background -->
  <polygon points="75,10 181,10 246,75 246,181 181,246 75,246 10,181 10,75" fill="url(#bg)" stroke="#d20a0a" stroke-width="6"/>
  
  <!-- Stylized G / M mark -->
  <text x="128" y="160" font-family="-apple-system, 'Impact', 'Arial Black', sans-serif" font-size="105" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="-4">MAX</text>
  <rect x="52" y="180" width="152" height="8" fill="url(#redGrad)" rx="2"/>
  <text x="128" y="206" font-family="-apple-system, 'Impact', 'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#d20a0a" text-anchor="middle" letter-spacing="4">GYM</text>
</svg>
